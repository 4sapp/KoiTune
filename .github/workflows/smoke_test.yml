name: Android startup smoke test

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful debug validation run containing the APK
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download tested APK
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: app-mobile-universal-debug-check-*
          path: apk
          merge-multiple: true

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_startup_smoke.sh

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-startup-evidence
          if-no-files-found: ignore
          path: |
            startup.txt
            crash-log.txt
            startup.png
            startup-window.xml
