name: Build Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Test release signing configuration
        run: python scripts/test_signing_config.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore if not exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build, test and lint Mobile Universal Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --console=plain assembleGmsMobileUniversalDebug :app:testGmsMobileUniversalDebugUnitTest :app:lintGmsMobileUniversalDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports-${{ github.event.number || github.run_number }}
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-mobile-universal-debug-check-${{ github.event.number || github.run_number }}
          path: |
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk
